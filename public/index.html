<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بانک‌یار — راه‌اندازی اولیه</title><style>body{font-family:Tahoma,sans-serif;background:#f6f7f3;color:#26382f;max-width:600px;margin:12vh auto;padding:24px;line-height:2}main{padding:28px;border:1px solid #dce4d8;border-radius:16px;background:white}small{color:#657567}</style></head><body><main><h1>بانک‌یار خصوصی</h1><p>صفحهٔ اولیه با موفقیت بارگذاری شد.</p><p>این فقط راه‌اندازی اولیهٔ میزبانی است؛ برنامهٔ مطالعه و اتصال خصوصی دیتابیس هنوز فعال نشده‌اند.</p><small>هیچ PDF، تصویر سؤال، رمز یا توکنی در این پوشه نیست.</small></main></body></html>
